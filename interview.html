<!DOCTYPE html>
<html>
<head>

    <title>AI Interview Questions</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🤖 AI Interview Questions</h1>

        <div class="score-box">
            Resume Score : {{ score }}%
        </div>

        {% for question in questions %}

        <div class="question-card">

            {{ question }}

        </div>

        {% endfor %}

        <br>

        <form action="/evaluate">

            <button type="submit">
                Submit Interview
            </button>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
